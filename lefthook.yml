# lefthook.yml — polyglot git hooks (TS/JS · Python · Rust) + secret scanning
# Copy into any repo root, then run:  lefthook install
# Tools used are already installed globally: biome, ruff, cargo/rustfmt/clippy, gitleaks.
#
# Hooks only touch STAGED files (fast), and auto-restage what they fix.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}"
      run: biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    ruff-lint:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true

    ruff-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true

    rustfmt:
      glob: "*.rs"
      run: rustfmt --edition 2021 {staged_files}
      stage_fixed: true

    gitleaks:
      run: gitleaks git --staged --redact --no-banner

pre-push:
  parallel: true
  commands:
    # Full secret scan over history before anything leaves the machine
    gitleaks-history:
      run: gitleaks git --redact --no-banner

    # Strict lint gate for Rust crates (slower — runs on push, not commit)
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings

    # Uncomment to gate pushes on tests:
    # tests:
    #   run: cargo nextest run    # or: pnpm test / uv run pytest
