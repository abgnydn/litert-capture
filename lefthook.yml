# lefthook.yml — git hooks for this JS-only repo: biome + secret scanning
# Run once after cloning:  lefthook install
# Tools used are already installed globally: biome, gitleaks.
#
# Hooks only touch STAGED files (fast), and auto-restage what they fix.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}"
      run: biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    gitleaks:
      run: gitleaks git --staged --redact --no-banner

pre-push:
  parallel: true
  commands:
    # Full secret scan over history before anything leaves the machine
    gitleaks-history:
      run: gitleaks git --redact --no-banner
